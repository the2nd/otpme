# Socket buffer limits for OTPme nodes.
#
# Copy this to /etc/sysctl.d/ on nodes that serve shares or backups.
#
# The OTPme filesystem client and the backup daemon ask the kernel for a large
# socket buffer, because they move data in bulk and a small one makes them
# slow. The kernel does not give more than the limits below allow, and it does
# not report an error when it gives less -- so without this file those two are
# quietly held to whatever the system default is. On a stock Linux that is
# 212992, and a socket then gets 425984 bytes.
#
# The OTPme daemons cannot set this themselves. They run with the kernel
# settings protected by systemd, so /proc/sys is read-only to them.
#
# No other OTPme daemon is affected: the rest leave the buffer to the kernel,
# which sizes it per connection and adjusts it as needed.
#
# How high: measured with the OTPme filesystem client, not guessed. The kernel
# doubles what a program asks for, so the limit here is half of what a socket
# can hold:
#
#   limit          a socket holds     result
#   212992         425984             slowest (the system default)
#   1048576        2097152            slower
#   4194304        8388608            slower
#   10485760       20971520           fastest
#   104857600      209715200          no faster than 10485760
#
# Ten megabytes is where it stops getting better, measured from both sides.
# The filesystem client moves data in chunks of 4 MiB, so this leaves room for
# several of them to be in flight at once, which is what keeps a transfer from
# stalling between chunks.
#
# Memory: these are limits, not reservations. What a connection holds is what
# it has in flight. But a single socket may reach 20 MB in each direction, so
# on a node serving many transfers at once, count with that before raising it.
net.core.rmem_max = 10485760
net.core.wmem_max = 10485760
